name: Atualizar Preços ANP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 3'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependências
        run: |
          pip install pandas requests
      
      - name: Executar script
        run: |
          python script.py
      
      - name: Verificar mudanças
        id: verificar
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add precos.json
          if git diff --staged --quiet; then
            echo "mudou=false" >> $GITHUB_OUTPUT
          else
            echo "mudou=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit e push
        if: steps.verificar.outputs.mudou == 'true'
        run: |
          git commit -m "Atualização automática dos preços - $(date -u +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
